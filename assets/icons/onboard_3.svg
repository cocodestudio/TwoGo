<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" fill="none">
  <!-- Soft radial background -->
  <circle cx="200" cy="175" r="150" fill="#022B3A" fill-opacity="0.04"/>
  <circle cx="200" cy="175" r="110" fill="#F7B32B" fill-opacity="0.06"/>

  <!-- === MAP BACKGROUND === -->
  <rect x="50" y="70" width="300" height="200" rx="24" fill="#EEF0F2"/>
  <!-- Map grid lines -->
  <line x1="50" y1="120" x2="350" y2="120" stroke="#D0D4D8" stroke-width="1"/>
  <line x1="50" y1="170" x2="350" y2="170" stroke="#D0D4D8" stroke-width="1"/>
  <line x1="50" y1="220" x2="350" y2="220" stroke="#D0D4D8" stroke-width="1"/>
  <line x1="120" y1="70" x2="120" y2="270" stroke="#D0D4D8" stroke-width="1"/>
  <line x1="200" y1="70" x2="200" y2="270" stroke="#D0D4D8" stroke-width="1"/>
  <line x1="280" y1="70" x2="280" y2="270" stroke="#D0D4D8" stroke-width="1"/>

  <!-- Road horizontal -->
  <rect x="50" y="158" width="300" height="24" rx="0" fill="white" fill-opacity="0.8"/>
  <line x1="50" y1="170" x2="350" y2="170" stroke="#F7B32B" stroke-width="1.5" stroke-dasharray="12 8"/>
  <!-- Road vertical -->
  <rect x="188" y="70" width="24" height="200" rx="0" fill="white" fill-opacity="0.7"/>
  <line x1="200" y1="70" x2="200" y2="270" stroke="#F7B32B" stroke-width="1.5" stroke-dasharray="12 8"/>

  <!-- Route path (curved) -->
  <path d="M90 240 Q90 170 140 170 Q190 170 200 120 Q210 80 260 80" stroke="#022B3A" stroke-width="4" stroke-linecap="round" fill="none" stroke-dasharray="0"/>
  <path d="M90 240 Q90 170 140 170 Q190 170 200 120 Q210 80 260 80" stroke="#F7B32B" stroke-width="2" stroke-linecap="round" fill="none" stroke-dasharray="8 6"/>

  <!-- Start pin -->
  <circle cx="90" cy="240" r="10" fill="#022B3A" stroke="white" stroke-width="2.5"/>
  <circle cx="90" cy="240" r="4" fill="#F7B32B"/>

  <!-- Destination pin -->
  <path d="M260 58 C252 58 245 65 245 74 C245 87 260 100 260 100 C260 100 275 87 275 74 C275 65 268 58 260 58Z" fill="#022B3A"/>
  <circle cx="260" cy="74" r="7" fill="white"/>
  <!-- Flag on destination -->
  <rect x="258" y="58" width="2" height="14" rx="1" fill="#F7B32B"/>
  <path d="M260 59 L270 63 L260 67Z" fill="#F7B32B"/>

  <!-- Moving Scooter on route -->
  <!-- Scooter body (small) -->
  <g transform="translate(172, 138) rotate(-20)">
    <circle cx="0" cy="14" r="10" fill="white" stroke="#022B3A" stroke-width="2.5"/>
    <circle cx="0" cy="14" r="4" fill="#022B3A"/>
    <circle cx="26" cy="14" r="10" fill="white" stroke="#022B3A" stroke-width="2.5"/>
    <circle cx="26" cy="14" r="4" fill="#022B3A"/>
    <path d="M0 14 L10 2 L22 2 L26 14" stroke="#022B3A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <rect x="8" y="-4" width="18" height="7" rx="3.5" fill="#022B3A"/>
    <rect x="8" y="-1" width="18" height="2.5" rx="1.25" fill="#F7B32B"/>
    <!-- Rider small helmet -->
    <circle cx="13" cy="-10" r="8" fill="#022B3A"/>
    <path d="M7 -7 Q13 -2 19 -7" stroke="#F7B32B" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Live ping animation circles around scooter -->
  <circle cx="185" cy="148" r="18" stroke="#F7B32B" stroke-width="1.5" fill="none" stroke-opacity="0.6"/>
  <circle cx="185" cy="148" r="28" stroke="#F7B32B" stroke-width="1" fill="none" stroke-opacity="0.35"/>
  <circle cx="185" cy="148" r="38" stroke="#F7B32B" stroke-width="0.8" fill="none" stroke-opacity="0.15"/>

  <!-- === LIVE TRACKING CARD (top-right overlay) === -->
  <rect x="270" y="80" width="72" height="44" rx="12" fill="#022B3A"/>
  <!-- Live dot -->
  <circle cx="284" cy="93" r="4" fill="#F7B32B"/>
  <text x="291" y="96" font-size="8" fill="#F7B32B" font-family="sans-serif" font-weight="700">LIVE</text>
  <rect x="280" y="101" width="54" height="3" rx="1.5" fill="white" fill-opacity="0.5"/>
  <rect x="280" y="107" width="38" height="3" rx="1.5" fill="white" fill-opacity="0.3"/>
  <!-- ETA badge -->
  <rect x="280" y="113" width="46" height="9" rx="4.5" fill="#F7B32B"/>
  <text x="303" y="120" text-anchor="middle" font-size="7.5" fill="#022B3A" font-family="sans-serif" font-weight="700">ETA: 4 min</text>

  <!-- === SOS / SAFETY CARD (bottom) === -->
  <rect x="55" y="285" width="290" height="60" rx="18" fill="white" stroke="#022B3A" stroke-width="1.5" stroke-opacity="0.1"/>
  <!-- SOS Button -->
  <circle cx="90" cy="315" r="22" fill="#022B3A"/>
  <circle cx="90" cy="315" r="17" fill="#FF3B3B"/>
  <text x="90" y="320" text-anchor="middle" font-size="9" fill="white" font-family="sans-serif" font-weight="800">SOS</text>

  <!-- Share location -->
  <rect x="125" y="297" width="100" height="36" rx="10" fill="#F5F5F0"/>
  <circle cx="142" cy="315" r="8" fill="#F7B32B"/>
  <!-- Share icon -->
  <circle cx="147" cy="311" r="2.5" fill="#022B3A"/>
  <circle cx="140" cy="315" r="2.5" fill="#022B3A"/>
  <circle cx="147" cy="319" r="2.5" fill="#022B3A"/>
  <line x1="142" y1="313" x2="147" y2="311" stroke="#022B3A" stroke-width="1.2"/>
  <line x1="142" y1="317" x2="147" y2="319" stroke="#022B3A" stroke-width="1.2"/>
  <rect x="154" y="310" width="62" height="4" rx="2" fill="#022B3A" fill-opacity="0.6"/>
  <rect x="154" y="317" width="44" height="3" rx="1.5" fill="#022B3A" fill-opacity="0.3"/>

  <!-- Verified badge -->
  <rect x="238" y="297" width="96" height="36" rx="10" fill="#022B3A"/>
  <circle cx="256" cy="315" r="9" fill="#F7B32B"/>
  <!-- Checkmark -->
  <path d="M251 315 L254 318 L261 311" stroke="#022B3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="270" y="309" width="55" height="4" rx="2" fill="white" fill-opacity="0.7"/>
  <rect x="270" y="316" width="40" height="3" rx="1.5" fill="white" fill-opacity="0.4"/>

  <!-- Decorative sparkles -->
  <circle cx="52" cy="100" r="4" fill="#F7B32B" fill-opacity="0.4"/>
  <circle cx="355" cy="260" r="3.5" fill="#022B3A" fill-opacity="0.25"/>
  <circle cx="350" cy="85" r="3" fill="#F7B32B" fill-opacity="0.5"/>

  <!-- Map corner decoration -->
  <path d="M50 82 Q50 70 62 70" stroke="#022B3A" stroke-width="1.5" fill="none" stroke-opacity="0.2"/>
  <path d="M338 70 Q350 70 350 82" stroke="#022B3A" stroke-width="1.5" fill="none" stroke-opacity="0.2"/>
  <path d="M350 258 Q350 270 338 270" stroke="#022B3A" stroke-width="1.5" fill="none" stroke-opacity="0.2"/>
  <path d="M62 270 Q50 270 50 258" stroke="#022B3A" stroke-width="1.5" fill="none" stroke-opacity="0.2"/>
</svg>
