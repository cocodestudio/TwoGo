<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" fill="none">
  <!-- Soft background circles -->
  <circle cx="200" cy="180" r="155" fill="#022B3A" fill-opacity="0.04"/>
  <circle cx="200" cy="180" r="115" fill="#F7B32B" fill-opacity="0.06"/>

  <!-- === PHONE MOCKUP CENTER === -->
  <rect x="145" y="60" width="110" height="210" rx="20" fill="white" stroke="#022B3A" stroke-width="3"/>
  <!-- Screen area -->
  <rect x="150" y="72" width="100" height="188" rx="14" fill="#F5F5F0"/>
  <!-- Notch -->
  <rect x="180" y="68" width="40" height="8" rx="4" fill="#022B3A"/>
  <!-- Home indicator -->
  <rect x="182" y="255" width="36" height="4" rx="2" fill="#022B3A" fill-opacity="0.25"/>

  <!-- App header on phone -->
  <rect x="150" y="72" width="100" height="30" rx="8" fill="#022B3A"/>
  <circle cx="168" cy="87" r="6" fill="#F7B32B"/>
  <rect x="180" y="83" width="45" height="4" rx="2" fill="white" fill-opacity="0.7"/>
  <rect x="180" y="90" width="30" height="3" rx="1.5" fill="white" fill-opacity="0.4"/>

  <!-- Ride card 1 on phone -->
  <rect x="156" y="108" width="88" height="50" rx="8" fill="white" stroke="#022B3A" stroke-width="1.2" stroke-opacity="0.12"/>
  <circle cx="169" cy="120" r="8" fill="#022B3A"/>
  <rect x="181" y="116" width="40" height="3.5" rx="1.75" fill="#022B3A" fill-opacity="0.7"/>
  <rect x="181" y="122" width="28" height="3" rx="1.5" fill="#022B3A" fill-opacity="0.35"/>
  <rect x="181" y="129" width="50" height="3" rx="1.5" fill="#022B3A" fill-opacity="0.2"/>
  <!-- Price badge -->
  <rect x="192" y="143" width="30" height="10" rx="5" fill="#F7B32B"/>
  <rect x="196" y="146" width="22" height="4" rx="2" fill="white"/>

  <!-- Ride card 2 on phone -->
  <rect x="156" y="163" width="88" height="50" rx="8" fill="#022B3A"/>
  <circle cx="169" cy="175" r="8" fill="#F7B32B"/>
  <rect x="181" y="171" width="40" height="3.5" rx="1.75" fill="white" fill-opacity="0.7"/>
  <rect x="181" y="177" width="28" height="3" rx="1.5" fill="white" fill-opacity="0.4"/>
  <rect x="181" y="184" width="50" height="3" rx="1.5" fill="white" fill-opacity="0.2"/>
  <!-- Price badge -->
  <rect x="192" y="198" width="30" height="10" rx="5" fill="#F7B32B"/>
  <rect x="196" y="201" width="22" height="4" rx="2" fill="#022B3A"/>

  <!-- Bottom nav on phone -->
  <rect x="150" y="234" width="100" height="26" rx="0" fill="white"/>
  <circle cx="175" cy="247" r="5" fill="#022B3A" fill-opacity="0.15"/>
  <circle cx="200" cy="247" r="5" fill="#F7B32B"/>
  <circle cx="225" cy="247" r="5" fill="#022B3A" fill-opacity="0.15"/>

  <!-- === LEFT FLOATING CARD: Offer Ride === -->
  <g filter="url(#shadow1)">
    <rect x="22" y="100" width="108" height="72" rx="16" fill="white" stroke="#F7B32B" stroke-width="1.5"/>
  </g>
  <circle cx="45" cy="122" r="14" fill="#022B3A"/>
  <!-- Rider icon in circle -->
  <circle cx="45" cy="117" r="5" fill="#F7B32B"/>
  <path d="M35 130 Q45 124 55 130" fill="#F7B32B"/>
  <!-- Text lines -->
  <rect x="64" y="116" width="50" height="4" rx="2" fill="#022B3A" fill-opacity="0.7"/>
  <rect x="64" y="123" width="36" height="3" rx="1.5" fill="#022B3A" fill-opacity="0.35"/>
  <!-- Arrow + label -->
  <rect x="36" y="140" width="72" height="22" rx="8" fill="#022B3A"/>
  <rect x="46" y="147" width="48" height="8" rx="2" fill="white" fill-opacity="0.0"/>
  <text x="76" y="154" text-anchor="middle" font-size="9" fill="white" font-family="sans-serif" font-weight="700">Offer Ride →</text>

  <!-- === RIGHT FLOATING CARD: Request Ride === -->
  <g filter="url(#shadow2)">
    <rect x="270" y="100" width="108" height="72" rx="16" fill="white" stroke="#022B3A" stroke-width="1.5" stroke-opacity="0.12"/>
  </g>
  <circle cx="293" cy="122" r="14" fill="#F7B32B"/>
  <!-- Person icon -->
  <circle cx="293" cy="117" r="5" fill="#022B3A"/>
  <path d="M283 130 Q293 124 303 130" fill="#022B3A"/>
  <rect x="312" y="116" width="50" height="4" rx="2" fill="#022B3A" fill-opacity="0.7"/>
  <rect x="312" y="123" width="36" height="3" rx="1.5" fill="#022B3A" fill-opacity="0.35"/>
  <rect x="260" y="140" width="130" height="0" rx="0" fill="none"/>
  <rect x="280" y="140" width="88" height="22" rx="8" fill="#F7B32B"/>
  <text x="324" y="154" text-anchor="middle" font-size="9" fill="#022B3A" font-family="sans-serif" font-weight="700">Request Ride →</text>

  <!-- === BOTTOM: COST SPLIT ILLUSTRATION === -->
  <!-- Coin stack left -->
  <ellipse cx="118" cy="275" rx="22" ry="9" fill="#F7B32B"/>
  <rect x="96" y="258" width="44" height="17" rx="0" fill="#F7B32B"/>
  <ellipse cx="118" cy="258" rx="22" ry="9" fill="#FFD76B"/>
  <ellipse cx="118" cy="252" rx="22" ry="9" fill="#F7B32B"/>
  <ellipse cx="118" cy="246" rx="22" ry="9" fill="#FFD76B"/>
  <!-- ₹ symbol -->
  <text x="118" y="251" text-anchor="middle" font-size="10" fill="#022B3A" font-family="sans-serif" font-weight="700">₹</text>

  <!-- Arrow between -->
  <path d="M148 262 L185 262" stroke="#022B3A" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/>
  <polygon points="183,258 191,262 183,266" fill="#022B3A"/>

  <!-- Split badge -->
  <rect x="192" y="248" width="60" height="28" rx="14" fill="#022B3A"/>
  <text x="222" y="263" text-anchor="middle" font-size="9" fill="#F7B32B" font-family="sans-serif" font-weight="700">Split Cost</text>
  <text x="222" y="272" text-anchor="middle" font-size="8" fill="white" font-family="sans-serif" fill-opacity="0.7">₹20-30</text>

  <!-- Arrow after -->
  <path d="M255 262 L292 262" stroke="#022B3A" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/>
  <polygon points="290,258 298,262 290,266" fill="#022B3A"/>

  <!-- Coin stack right (smaller = saved) -->
  <ellipse cx="320" cy="272" rx="18" ry="7" fill="#F7B32B"/>
  <rect x="302" y="259" width="36" height="13" rx="0" fill="#F7B32B"/>
  <ellipse cx="320" cy="259" rx="18" ry="7" fill="#FFD76B"/>
  <ellipse cx="320" cy="253" rx="18" ry="7" fill="#F7B32B"/>
  <text x="320" y="257" text-anchor="middle" font-size="9" fill="#022B3A" font-family="sans-serif" font-weight="700">₹</text>
  <!-- Checkmark -->
  <circle cx="335" cy="248" r="8" fill="#022B3A"/>
  <path d="M330 248 L333 251 L340 244" stroke="#F7B32B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Eco leaf top right -->
  <path d="M350 80 C350 60 370 55 378 70 C385 85 370 95 350 80Z" fill="#022B3A" fill-opacity="0.12"/>
  <path d="M350 80 C362 70 375 75 378 70" stroke="#022B3A" stroke-width="1.5" fill="none" stroke-opacity="0.3"/>

  <!-- Sparkles -->
  <circle cx="60" cy="200" r="3.5" fill="#F7B32B" fill-opacity="0.5"/>
  <circle cx="355" cy="170" r="3" fill="#022B3A" fill-opacity="0.25"/>
  <circle cx="38" cy="295" r="4" fill="#F7B32B" fill-opacity="0.35"/>

  <defs>
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#022B3A" flood-opacity="0.10"/>
    </filter>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#022B3A" flood-opacity="0.08"/>
    </filter>
  </defs>
</svg>
