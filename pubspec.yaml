name: twogo
description: "Smart Ride System"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4
  google_fonts: ^8.0.2
  http: ^1.6.0
  flutter_svg: ^2.2.4
  google_maps_flutter: ^2.15.0
  geolocator: ^14.0.2
  location: ^8.0.1
  firebase_core: ^4.5.0
  geocoding: ^4.0.0
  image_picker: ^1.2.1

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_logo.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icons/app_icon.png

  android_12:
    image: assets/icons/app_icon.png
    icon_background_color: "#FFFFFF"

  android: true
  ios: true
  fullscreen: false
  android_gravity: center
  ios_content_mode: center